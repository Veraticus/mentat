name: CI

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: python3 -m unittest discover -s ha/tests
      - run: python3 -m unittest discover -s voice/tests

  android:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs: a tag or branch is mutable, so
      # an unpinned `uses:` runs whatever the upstream repo points at today.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - run: nix develop .#android-unit --command bash -ceu 'cd android && gradle lintDebug test'
